name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # The runtime verification tasks (doomSmoke, triProbe, moveProbe, arenaProbe) all
      # need a DOOM IWAD. No game data may be committed to this repository, so they cannot
      # run here and are left to contributors, who pass their own WAD:
      #
      #   ./gradlew doomSmoke -Pwad=/path/to/DOOM.WAD
      #
      # See CONTRIBUTING.md.

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: latte-doom
          path: build/libs/*.jar
          if-no-files-found: error
