plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

sourceSets {
	main {
		java {
			// The vendored Mocha Doom engine (GPL) lives beside the mod sources.
			srcDir 'src/mochadoom'
		}
	}
}

loom {
	accessWidenerPath = file('src/main/resources/lattedoom.accesswidener')
	runs {
		client {
			programArgs("--username", "Steve")
			// offline names hash into one of NINE default skins — pin classic Steve
			vmArgs("-Dlattedoom.steveskin=true")
		}
		client2 {
			client()
			runDir "run2"
			programArgs("--username", "Marine")
			// second client instance for LAN co-op testing
			vmArgs("-Dlattedoom.title=Latte Doom P2", "-Dlattedoom.steveskin=true",
				"-Dlattedoom.cull=false")
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	// The 2010-era engine code trips every lint in existence; errors still fail the build.
	it.options.warnings = false
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Sector-triangulation gate: every map must triangulate watertight (see TriProbe).
tasks.register('triProbe', JavaExec) {
	group = 'verification'
	description = 'Triangulate every map of a WAD; assert watertight sector geometry.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.TriProbe'
	args = [
		(project.findProperty('wad') ?: 'DOOM.WAD').toString(),
		(project.findProperty('map') ?: '').toString()
	]
}

// Player-collision gate: sprint from every P1 start in 8 directions (see MoveProbe).
tasks.register('moveProbe', JavaExec) {
	group = 'verification'
	description = 'Walk every map headless with the DOOM collision port; assert containment.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.MoveProbe'
	args = [
		(project.findProperty('wad') ?: 'DOOM.WAD').toString(),
		(project.findProperty('map') ?: '').toString()
	]
}

// Boots the real engine WITHOUT Minecraft and dumps PNG frames of the title demo.
tasks.register('doomSmoke', JavaExec) {
	group = 'verification'
	description = 'Headless engine smoke test: boot the given IWAD, dump frames as PNGs.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.HeadlessSmoke'
	workingDir = file('run-smoke')
	doFirst { file('run-smoke').mkdirs() }
	args = [(project.findProperty('wad') ?: 'DOOM.WAD').toString()]
}

tasks.register('arenaProbe', JavaExec) {
	group = 'verification'
	description = 'Overworld-arena A0 proof: boot the engine on a generated arena, verify an imp lives.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.ArenaProbe'
	workingDir = file('run-arena')
	doFirst { file('run-arena').mkdirs() }
	ignoreExitValue = true
}

// TNT MAP30 diagnostic: the red gate's USE reach and the doll-pad teleport death.
tasks.register('tntProbe', JavaExec) {
	group = 'verification'
	description = 'TNT MAP30 diagnostic: keyed-gate USE reach + voodoo-doll telefrag billing.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.TntProbe'
	workingDir = file('run-tnt')
	doFirst { file('run-tnt').mkdirs() }
	ignoreExitValue = true
	args = [(project.findProperty('wad') ?: '').toString(),
	        (project.findProperty('file') ?: '').toString()].findAll { !it.isEmpty() }
}

// Client-side mesh diagnostic: bake a moving sector static vs mid-glide and diff.
// BSP mesh vs classic mesh on every map of a WAD: areas and wall lengths must agree.
tasks.register('bspProbe', JavaExec) {
	group = 'verification'
	description = 'BSP-truth mesh vs the classic mesh, every map, areas + wall lengths.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.BspProbe'
	ignoreExitValue = true
	args = [(project.findProperty('wad') ?: '').toString()].findAll { !it.isEmpty() }
}

tasks.register('meshProbe', JavaExec) {
	group = 'verification'
	description = 'Bake a mover sector static vs interpolated and diff the outputs.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.MeshGlideProbe'
	args = [(project.findProperty('wad') ?: '').toString(),
	        (project.findProperty('map') ?: 'E1M8').toString(),
	        (project.findProperty('sector') ?: '30').toString()].findAll { !it.isEmpty() }
}

// Boss-special diagnostic: kill a named boss type on a map, watch the tagged sectors.
tasks.register('bossProbe', JavaExec) {
	group = 'verification'
	description = 'Boss specials: the named type dies, the tagged sectors must move.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.BossProbe'
	workingDir = file('run-tnt')
	doFirst { file('run-tnt').mkdirs() }
	ignoreExitValue = true
	args = [(project.findProperty('wad') ?: '').toString(),
	        (project.findProperty('warp') ?: '18').toString(),
	        (project.findProperty('type') ?: 'MT_BRUISER').toString(),
	        (project.findProperty('file') ?: '').toString()].findAll { !it.isEmpty() }
}

tasks.register('saveProbe', JavaExec) {
	group = 'verification'
	description = 'Savegame round trip: G_SaveGame writes the per-set .dsg, G_LoadGame restores it.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.SaveProbe'
	workingDir = file('run-tnt')
	doFirst { file('run-tnt').mkdirs() }
	ignoreExitValue = true
	args = [(project.findProperty('wad') ?: '').toString()].findAll { !it.isEmpty() }
}

// Prints the seamless loader's classification of every file in a wads folder.
tasks.register('wadProbe', JavaExec) {
	group = 'verification'
	description = 'Classify every WAD/deh in a folder the way /load does.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.WadScanProbe'
	args = [(project.findProperty('dir') ?: '').toString()].findAll { !it.isEmpty() }
}

// Parses+applies DEHACKED/BEX from a wad or .deh file against the real tables, no engine boot.
tasks.register('dehProbe', JavaExec) {
	group = 'verification'
	description = 'DEHACKED/BEX parser proof: parse+apply a wad\'s DEHACKED lumps (default: Eviternity).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.blackwithersteve.lattedoom.harness.DehProbe'
	args = [(project.findProperty('dehFile') ?: '').toString()].findAll { !it.isEmpty() }
}
